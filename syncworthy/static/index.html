<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncworthy</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="vendor/monaco.css">
    <link rel="stylesheet" href="css/main.css?v=9">
    <link rel="stylesheet" href="css/collab.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=EB+Garamond:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <!-- Monaco workers: the editor worker only (language services are switched off, see languages.js) -->
    <script>
        self.MonacoEnvironment = {
            getWorker: function (_id, label) {
                return new Worker('vendor/monaco-editor.worker.mjs', { type: 'module', name: label });
            }
        };
    </script>
    <!-- Yjs CRDT for collaborative editing -->
    <script type="module">
        // Served from vendor/ rather than a CDN: a browser that blocks
        // third-party modules (extension, tracking protection, a school
        // proxy) left Y undefined and the editor dead. Keeping the module
        // graph intact matters -- yjs must stay a single shared instance.
        import * as Y from './vendor/yjs.mjs';
        import { WebsocketProvider } from './vendor/y-websocket.mjs';
        import { MonacoBinding } from './vendor/y-monaco.mjs';
        // The ONE Monaco.  y-monaco imports the same module (its editor.api
        // import is rewired onto this file), so the binding, decorations and
        // the editor the app creates all share one instance.
        import * as monaco from './vendor/monaco.mjs';

        window.monaco = monaco;
        window.Y = Y;
        window.WebsocketProvider = WebsocketProvider;
        window.MonacoBinding = MonacoBinding;
    </script>
</head>

<body>
    <div id="app">
        <!-- MAIN CONTENT -->
        <div class="main-content">
            <!-- EDITOR PAGE -->
            <div class="page active" id="page-editor">
                <!-- File Sidebar -->
                <aside class="sidebar glass">
                    <div class="sidebar-header">
                        <h3>Explorer</h3>
                        <div class="sidebar-actions">
                            <div class="dropdown" id="new-dropdown">
                                <button class="icon-btn" onclick="app.toggleNewDropdown()" title="New...">
                                    <i data-lucide="plus"></i>
                                </button>
                                <div class="dropdown-menu" id="new-dropdown-menu">
                                    <button class="dropdown-item" onclick="app.createNewFile()">
                                        <i data-lucide="file-plus"></i> New File
                                    </button>
                                    <button class="dropdown-item" onclick="app.createNewFolder()">
                                        <i data-lucide="folder-plus"></i> New Folder
                                    </button>
                                </div>
                            </div>
                            <button class="icon-btn" onclick="app.uploadFiles()" title="Upload Files">
                                <i data-lucide="upload"></i>
                            </button>
                            <button class="icon-btn" onclick="app.refreshTree()" title="Refresh">
                                <i data-lucide="refresh-cw"></i>
                            </button>
                        </div>
                    </div>
                    <div class="sidebar-content" id="file-tree"></div>
                </aside>

                <!-- Editor -->
                <section class="editor-area glass">
                    <div class="editor-header">
                        <div class="editor-filename">
                            <i data-lucide="file-code"></i>
                            <span id="active-filename">Select a file</span>
                        </div>
                        <div id="online-users" class="user-avatars"></div>
                        <div class="error-container" id="error-container">
                            <div id="error-count" class="error-count" onclick="app.toggleErrorDetails()">
                                <i data-lucide="alert-circle"></i>
                                <span id="error-count-text">0 errors</span>
                                <i data-lucide="chevron-down" class="error-chevron"></i>
                            </div>
                            <div id="error-details" class="error-details"></div>
                        </div>
                        <div class="editor-actions">
                            <span class="save-indicator" id="save-status"></span>
                        </div>
                    </div>

                    <!-- Chat Panel -->


                    <div id="monaco-container"></div>
                </section>

                <!-- Resizer -->
                <div id="editor-resizer" class="resizer"></div>

                <!-- Preview -->
                <aside class="preview-panel glass">
                    <div class="preview-header">
                        <h3>Preview</h3>
                    </div>
                    <div id="preview-container">
                        <div class="preview-placeholder">
                            <i data-lucide="eye"></i>
                            <span id="preview-placeholder-text">Select a file</span>
                        </div>
                    </div>
                </aside>
            </div>

            <!-- CONFIG PAGE -->
            <div class="page" id="page-config">
                <div class="config-layout">
                    <aside class="config-sidebar glass">
                        <!-- tabs are filled in from the settings registry (js/modules/settings.js) -->
                    </aside>
                    <section class="config-content glass" id="config-content">
                        <!-- Dynamic content -->
                    </section>
                </div>
            </div>

            <!-- Plugin pages (builds, actions, ...) are added here by app.registerPage() -->
        </div>

        <!-- macOS DOCK -->
        <div class="dock-container">
            <div class="dock">
                <div class="dock-item active" data-page="editor" onclick="app.showPage('editor')">
                    <div class="dock-icon">
                        <i data-lucide="code-2"></i>
                    </div>
                    <span class="dock-label">Editor</span>
                    <span class="dock-dot"></span>
                </div>
                <div class="dock-item" data-page="config" onclick="app.showPage('config')">
                    <div class="dock-icon">
                        <i data-lucide="settings"></i>
                    </div>
                    <span class="dock-label">Settings</span>
                    <span class="dock-dot"></span>
                </div>

                <!-- Chat Dock Item -->
                <div class="dock-item" id="dock-chat-btn" onclick="app.toggleChat()">
                    <div class="dock-icon" style="position: relative;">
                        <i data-lucide="message-square"></i>
                        <span class="unread-badge" id="chat-unread-badge" style="display: none;"></span>
                    </div>
                    <span class="dock-label">Chat</span>
                    <span class="dock-dot"></span>
                </div>
            </div>
        </div>

    </div>

    <!-- File Context Menu -->
    <div class="context-menu" id="file-context-menu">
        <button class="context-menu-item" onclick="app.renameFile()">
            <i data-lucide="pencil"></i>
            Rename
        </button>
        <button class="context-menu-item" onclick="app.moveFile()">
            <i data-lucide="folder-input"></i>
            Move
        </button>
        <button class="context-menu-item danger" onclick="app.deleteFile()">
            <i data-lucide="trash-2"></i>
            Delete
        </button>
    </div>

    <!-- GLOBAL CHAT PANEL -->
    <div id="chat-panel" class="chat-panel hidden" style="position: fixed; bottom: 80px; right: 20px; z-index: 1000;">
        <div class="chat-header">
            <h4>Chat</h4>
            <button class="icon-btn-small" onclick="app.toggleChat()"><i data-lucide="x"></i></button>
        </div>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="app.handleChatKey(event)">
            <button class="icon-btn-small" onclick="app.sendChatMessage()"><i data-lucide="send"></i></button>
        </div>
    </div>

    <!-- Hidden file input for uploads -->
    <input type="file" id="file-upload-input" multiple style="display: none;" onchange="app.handleFileUpload(event)">

    <!-- Core modules (loaded before app.js so mixins are available).  Plugin
         bundles are loaded after these, from /plugins/<name>/, by app.boot(). -->
    <script src="js/modules/utils.js"></script>
    <script src="js/modules/plugin_api.js"></script>
    <script src="js/modules/languages.js"></script>
    <script src="js/modules/file_tree.js"></script>
    <script src="js/modules/collab.js"></script>
    <script src="js/modules/settings.js"></script>
    <script src="js/modules/actions.js"></script>
    <script src="js/modules/chat.js"></script>
    <!-- Core app -->
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>

</html>
