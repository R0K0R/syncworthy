[project]
name = "syncworthy"
version = "0.1.0"
description = "A real-time collaborative editor for any project, extended by plugins"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"   # tomllib

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pycrdt>=0.8.0",
    "pycrdt-websocket>=0.12.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
syncworthy = "syncworthy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["syncworthy"]

[tool.ruff]
line-length = 120
target-version = "py311"
